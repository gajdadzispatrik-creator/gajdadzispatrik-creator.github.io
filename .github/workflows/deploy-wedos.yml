# Nasazení OSTRÉHO webu na Wedos (patrikgajdadzis.cz). Spouští se jen
# záměrně: štítkem `ostry-*` (git tag ostry-2026-10-10a && git push origin
# ostry-2026-10-10a) nebo ručně v Actions → „Nasazení na Wedos“ → Run
# workflow. Běžný push do main jde jen na náhled (preview.yml), ne sem.
#
# Přístup k FTP je v tajných údajích repozitáře (Settings → Secrets and
# variables → Actions), zadává je Patrik, v kódu ani v logu nejsou:
#   WEDOS_FTP_HOST      např. 405333.w33.wedos.net
#   WEDOS_FTP_USER      např. w405333
#   WEDOS_FTP_PASSWORD  heslo FTP účtu
#
# lftp nahraje celý dist/ včetně skrytých .htaccess a api/.htaccess
# (docs/deploy-wedos.md). Složku api/limity/ na serveru nemaže (drží limit
# odeslání formuláře) a nic jiného na serveru také nemaže. Navíc nahraje
# upravený hostingový /www/.htaccess (deploy/www.htaccess — bez pravidla
# Wedosu, které přidává koncové lomítko a se stránkami bez lomítka dělalo
# nekonečnou smyčku přesměrování).
#
# Pořadí (4. 11. 2026): nejdřív dist/_astro/ (styly, skripty, obrázky
# s otiskem v názvu), až potom stránky. Nový soubor je na Wedosu chvíli
# po nahrání nedostupný (403), a když nová stránka přišla dřív než její
# styl, web se během nasazení ukázal bez vzhledu. Staré soubory zůstávají,
# takže stará stránka funguje, dokud ji nepřepíše nová.
# _astro/ se porovnává jen podle velikosti (--ignore-time): soubory mají
# otisk obsahu v názvu, nezměněné se tedy znovu nenahrávají (dřív se při
# každém nasazení přepsaly všechny a ~20 s vracely 403 i staré stránce).
# xfer:use-temp-file: soubor se nahraje pod dočasným jménem a hotový se
# přejmenuje, takže stránka není během nahrávání nedostupná.
#
# Vydávání článků podle data (Patrik 4. 11. 2026): každé ráno v 5:15 UTC
# (6:15 / 7:15 českého času) se spustí plán `schedule`. Nahraje web jen
# tehdy, když má ten den vyjít schválený článek (scripts/clanky-k-vydani.mjs),
# a sestaví ho z POSLEDNÍHO štítku ostry-* (ne z main) – na web tak nikdy
# nejde nic, co Patrik neschválil. Schválený článek s budoucím datem se na
# webu do svého dne neukáže (src/data/articles.ts).
name: Nasazení na Wedos

on:
  workflow_dispatch:
  push:
    tags: ['ostry-*']
  schedule:
    - cron: '15 4 * * *'

permissions:
  contents: read

concurrency:
  group: wedos-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Pevná verze systému (11. 11. 2026: ubuntu-latest dvakrát selhal na instalaci lftp).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ranní plán – poslední schválená verze (štítek ostry-*)
        if: github.event_name == 'schedule'
        run: |
          TAG=$(git tag -l 'ostry-*' --sort=-refname | head -1)
          echo "Sestavuji z $TAG"
          git checkout -q "$TAG"
      - name: Vychází dnes článek?
        id: clanky
        run: node scripts/clanky-k-vydani.mjs
      - name: Konec – dnes nic nevychází
        if: github.event_name == 'schedule' && steps.clanky.outputs.due != 'true'
        run: echo "Dnes žádný článek nevychází, web se nenahrává."
      - uses: actions/setup-node@v4
        if: github.event_name != 'schedule' || steps.clanky.outputs.due == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: github.event_name != 'schedule' || steps.clanky.outputs.due == 'true'
      - run: npm run build
        if: github.event_name != 'schedule' || steps.clanky.outputs.due == 'true'
      - name: Kontrola, že build obsahuje skryté soubory a PHP
        if: github.event_name != 'schedule' || steps.clanky.outputs.due == 'true'
        run: |
          test -f dist/.htaccess
          test -f dist/api/.htaccess
          test -f dist/api/poptavka.php
          ! grep -q 'noindex, nofollow' dist/index.html
      # 11. 11. 2026: místo lftp vlastní skript v Pythonu (instalace lftp přes apt
      # na serverech GitHubu opakovaně selhávala/visela). Chování stejné:
      # nejdřív _astro/ (jen nové), potom zbytek přes dočasný soubor a přejmenování,
      # api/limity/ se nenahrává ani nemaže, nakonec deploy/www.htaccess → /www/.htaccess.
      - name: Nahrání na Wedos (FTP s TLS)
        if: github.event_name != 'schedule' || steps.clanky.outputs.due == 'true'
        env:
          FTP_HOST: ${{ secrets.WEDOS_FTP_HOST }}
          FTP_USER: ${{ secrets.WEDOS_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.WEDOS_FTP_PASSWORD }}
        run: python3 scripts/deploy-wedos.py
